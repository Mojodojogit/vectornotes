<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vector Notes – Aus Google Drive einfügen</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f5f2; --fg: #1c1c1c; --muted: #6b6b6b; --accent: #d48a1f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1c; --fg: #ecebe8; --muted: #a8a8a8; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 440px; padding: 32px 24px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  button { font: inherit; font-weight: 600; padding: 10px 20px; border: 0; border-radius: 12px; background: var(--accent);
    color: #1c1c1c; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1 id="title">Google-Dateiauswahl wird geöffnet …</h1>
  <p id="text">Wähle die Dateien aus, die Vector Notes einfügen soll. Danach geht es in der App weiter.</p>
  <button id="again" hidden>Dateiauswahl erneut öffnen</button>
</main>
<script>
  // Windows-App: Die App öffnet diese Seite im Browser, weil die Google-Dateiauswahl nur von einer echten
  // Webadresse aus funktioniert. Zugangsschlüssel und Rückkanal kommen im Fragment (#…, geht an keinen Server).
  // Die Auswahl (nur Kennungen und Namen) geht an den lokalen Empfänger der App auf 127.0.0.1 zurück.
  // Kein Entwicklerschlüssel: mit Zugangs-Token braucht die Auswahl keinen, und Google lehnt ihn hier als „ungültig“ ab.
  const p = new URLSearchParams(location.hash.slice(1))
  history.replaceState(null, '', location.pathname)
  const port = Number(p.get('port')), state = p.get('state') || '', token = p.get('token'), key = p.get('key'), appId = p.get('app')
  const title = document.getElementById('title'), text = document.getElementById('text'), again = document.getElementById('again')
  const back = q => location.replace(`http://127.0.0.1:${port}/picked?state=${encodeURIComponent(state)}&${q}`)
  const fail = m => { title.textContent = 'Das hat nicht geklappt'; text.textContent = m }
  if (!(port > 1023 && port < 65536) || !token || !/^\d+$/.test(appId || '')) fail('Bitte die Dateiauswahl in Vector Notes neu öffnen.')
  else {
    const s = document.createElement('script')
    s.src = 'https://apis.google.com/js/api.js'
    s.onerror = () => fail('Google konnte nicht geladen werden. Prüfe die Internetverbindung.')
    s.onload = () => gapi.load('picker', open)
    document.head.appendChild(s)
  }
  function open() {
    const g = google.picker
    new g.PickerBuilder()
      .addView(new g.DocsView(g.ViewId.DOCS).setIncludeFolders(true).setSelectFolderEnabled(false))
      .enableFeature(g.Feature.MULTISELECT_ENABLED)
      .setOAuthToken(token).setAppId(appId)
      .setLocale('de').setTitle('Aus Google Drive einfügen')
      .setCallback(d => {
        if (d.action === g.Action.PICKED) {
          const files = d.docs.map(x => ({ id: x.id, name: x.name, mime: x.mimeType }))
          title.textContent = 'Fertig'
          text.textContent = 'Die Dateien werden in Vector Notes eingefügt. Du kannst diesen Tab schließen.'
          back('files=' + encodeURIComponent(JSON.stringify(files)))
        } else if (d.action === g.Action.CANCEL) {
          title.textContent = 'Abgebrochen'
          text.textContent = 'Du kannst diesen Tab schließen.'
          back('cancel=1')
        }
      })
      .build().setVisible(true)
    again.hidden = false
    again.onclick = open
  }
</script>
</body>
</html>
